services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: momentum
      POSTGRES_USER: momentum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momentum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentum -d momentum"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://momentum:${POSTGRES_PASSWORD:-momentum}@postgres:5432/momentum
    stdin_open: true

volumes:
  pgdata:
